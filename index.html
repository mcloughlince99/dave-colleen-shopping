<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Grocery Run</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  :root { color-scheme: dark; }
  body { background: #121316; color: #F4F4F6; padding-bottom: 60px; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 32px 20px 24px; }
  .top-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; background: linear-gradient(90deg, #A78BFA, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .start-over { font-size: 12px; font-weight: 500; color: #9CA3AF; background: none; border: none; cursor: pointer; }
  .start-over:hover { color: #F43F5E; }
  .progress { font-size: 14px; color: #9CA3AF; font-weight: 500; margin-bottom: 4px; }
  .status { font-size: 12px; color: #9CA3AF; margin-bottom: 20px; min-height: 16px; }
  .status.error { color: #F43F5E; }
  .status.ok { color: #34D399; }
  .store-card { background: #1C1E23; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.4); border: 1px solid #2A2D34; margin-bottom: 24px; overflow: hidden; }
  .store-header { background: linear-gradient(135deg, #7C3AED, #5B21B6); padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
  .store-header h2 { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
  .store-header p { color: #E9D5FF; font-size: 12px; margin-top: 2px; }
  .uncheck-btn { background: none; border: none; color: #E9D5FF; cursor: pointer; padding: 8px; display: flex; }
  .uncheck-btn:hover { color: #fff; }
  ul { list-style: none; }
  li.item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid #2A2D34; }
  li.item:last-child { border-bottom: none; }
  .checkbox { flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; border: 2px solid #4B4F58; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .checkbox.checked { background: #8B5CF6; border-color: #8B5CF6; }
  .checkbox svg { display: none; }
  .checkbox.checked svg { display: block; }
  .item-text { flex: 1; text-align: left; background: none; border: none; font-size: 15px; font-weight: 500; color: #F4F4F6; cursor: pointer; }
  .item-text.checked { text-decoration: line-through; color: #6B7280; }
  .icon-btn { flex-shrink: 0; background: none; border: none; color: #9CA3AF; cursor: pointer; padding: 4px; display: flex; }
  .icon-btn:hover { color: #F43F5E; }
  .icon-btn.remove { color: #6B7280; }
  .thumb-wrap { position: relative; flex-shrink: 0; }
  .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; display: block; border: 1px solid #2A2D34; cursor: pointer; }
  .thumb-remove { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #F43F5E; color: #fff; border: 1.5px solid #1C1E23; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 85vh; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .lightbox-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lightbox-remove { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: #F43F5E; color: #fff; border: none; border-radius: 20px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .add-row { display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: #202329; }
  .add-row input { flex: 1; background: transparent; border: none; font-size: 14px; outline: none; padding: 4px 0; color: #F4F4F6; }
  .add-row input::placeholder { color: #6B7280; }
  .add-btn { background: #8B5CF6; color: #fff; border-radius: 50%; width: 28px; height: 28px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .add-btn:hover { background: #7C3AED; }
  .add-store-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; color: #9CA3AF; border: 1px dashed #3F434C; border-radius: 12px; padding: 12px; background: #1C1E23; cursor: pointer; }
  .add-store-btn:hover { color: #A78BFA; border-color: #8B5CF6; }
  .add-store-row { display: flex; align-items: center; gap: 8px; background: #1C1E23; border: 1px solid #2A2D34; border-radius: 12px; padding: 12px 16px; box-shadow: 0 1px 6px rgba(0,0,0,0.4); }
  .add-store-row input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; color: #F4F4F6; }
  .add-store-row .save { color: #A78BFA; font-weight: 600; font-size: 14px; background: none; border: none; cursor: pointer; padding: 0 8px; }
  .add-store-row .cancel { color: #9CA3AF; background: none; border: none; cursor: pointer; display: flex; }
  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #9CA3AF; font-weight: 500; font-size: 14px; }
  .signin-btn { background: #8B5CF6; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .signin-btn:hover { background: #7C3AED; }
  /* Who-shops: filter bar (Everything / Mine / Dave's) */
  .filter-bar { display: flex; background: #1C1E23; border: 1px solid #2A2D34; border-radius: 10px; padding: 3px; margin-bottom: 20px; }
  .filter-bar button { flex: 1; background: none; border: none; color: #9CA3AF; font-size: 13px; font-weight: 600; padding: 8px 0; border-radius: 7px; cursor: pointer; }
  .filter-bar button.active { background: #8B5CF6; color: #fff; }
  /* Who-shops: the little C / D / Both tag on each item (tap to switch) */
  .who-tag { flex-shrink: 0; min-width: 40px; border-radius: 12px; border: none; font-size: 11px; font-weight: 700; padding: 4px 8px; cursor: pointer; }
  .who-tag.colleen { background: #22D3EE; color: #0B2530; }
  .who-tag.dave { background: #F59E0B; color: #2B1A02; }
  .who-tag.both { background: #3F434C; color: #E5E7EB; }
  /* Who-shops: one-time "who's on this phone?" picker, and "You're X · change" line */
  .who-pick { display: flex; align-items: center; gap: 8px; background: #1C1E23; border: 1px solid #8B5CF6; border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; font-size: 14px; }
  .who-pick span { flex: 1; }
  .who-pick button { background: #8B5CF6; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .filter-bar { margin-bottom: 6px !important; }
  .who-me { font-size: 12px; color: #6B7280; margin-bottom: 20px; }
  .who-me button { background: none; border: none; color: #9CA3AF; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .empty-note { padding: 12px 20px; font-size: 13px; color: #6B7280; }
</style>
</head>
<body>

<div id="loading" class="loading">Loading your list...</div>
<div id="signin" class="loading" style="display:none;">
  <div style="text-align:center; padding: 0 24px;">
    <p id="signin-msg" style="margin-bottom:16px;">Sign in to see your list</p>
    <button id="signin-btn" class="signin-btn" onclick="doSignIn()">Sign in with Google</button>
  </div>
</div>
<div id="app" class="wrap" style="display:none;"></div>

<div id="lightbox" class="lightbox" onclick="if(event.target===this) closeLightbox();">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lightbox-img" src="" />
  <button class="lightbox-remove" id="lightbox-remove-btn" onclick="removePhotoFromLightbox()">Remove photo</button>
</div>

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<!-- Real config lives in firebase-config.js (gitignored, never committed). -->
<!-- Copy firebase-config.example.js to firebase-config.js and fill in your own project. -->
<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.enablePersistence().catch((err) => {
  console.warn("Offline persistence not enabled:", err.code);
});
const docRef = db.collection("checklist").doc("main");

const DEFAULT_STORES = {
  Costco: ["Eggs"],
  Aldi: ["Bread"]
};

function makeId(text, i) {
  return text + "-" + i + "-" + Math.random().toString(36).slice(2, 7);
}

function buildDefaultState() {
  const stores = {};
  for (const [name, list] of Object.entries(DEFAULT_STORES)) {
    stores[name] = list.map((text, i) => ({ id: makeId(text, i), text, checked: false, photo: null, who: "both" }));
  }
  return { stores };
}

let state = null;
let suppressNextSnapshot = false;

const app = document.getElementById("app");
const loadingEl = document.getElementById("loading");
const signinEl = document.getElementById("signin");
const signinMsg = document.getElementById("signin-msg");
const signinBtn = document.getElementById("signin-btn");

// Who may use the list is decided ONLY by the Firestore security rule (in the
// Firebase console). No email addresses live in this public file: if the rule
// refuses an account, the listener's error handler below shows "no access".

// ---- Who shops for what ----
// Each item has a `who`: "colleen", "dave", or "both" (we look together).
// Old items saved before this feature have no `who`, so we treat them as "both".
const WHO_LABEL = { colleen: "C", dave: "D", both: "Both" };
const WHO_NEXT = { colleen: "dave", dave: "both", both: "colleen" }; // tap order

// Which person is signed in on this phone. Each person picks "Colleen" or
// "Dave" once; the answer is saved in a protected Firestore doc
// (checklist/people), keyed by their Firebase user id — not in this file.
const peopleRef = db.collection("checklist").doc("people");
let myUid = null;
let peopleLoaded = false; // don't flash the "who are you?" picker before we know
let myKey = null;         // "colleen" | "dave" | null (not picked yet)
let otherKey = null;

function setMe(key) {
  peopleRef.set({ [myUid]: key }, { merge: true }).catch((err) => {
    console.error(err);
    showStatus("Couldn't save — check your connection.", true);
  });
}

// "change" link: clear my pick so the picker shows again
function clearMe() {
  myKey = null; otherKey = null;
  peopleRef.set({ [myUid]: firebase.firestore.FieldValue.delete() }, { merge: true }).catch(() => {});
  render();
}

// Which view is showing: "all" | "me" | "other". Remembered on this phone only.
let filter = localStorage.getItem("grocery-filter") || "all";

function whoOf(item) {
  return WHO_LABEL[item.who] ? item.who : "both";
}

// Should this item show under the current filter?
// "Mine" = my items + together items; same idea for the other person.
function isVisible(item) {
  if (!myKey) return true; // until you pick who you are, show everything
  const w = whoOf(item);
  if (filter === "me") return w === myKey || w === "both";
  if (filter === "other") return w === otherKey || w === "both";
  return true;
}

function setFilter(f) {
  filter = f;
  localStorage.setItem("grocery-filter", f);
  render();
}

// Tap the tag: C -> D -> Both -> C
function cycleWho(storeName, id) {
  state.stores[storeName] = state.stores[storeName].map(i =>
    i.id === id ? { ...i, who: WHO_NEXT[whoOf(i)] } : i
  );
  render(); save();
}

const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();

function doSignIn() {
  auth.signInWithPopup(googleProvider).catch((err) => {
    console.error(err);
    signinMsg.textContent = "Sign-in failed — try again.";
  });
}

function doSignOut() {
  auth.signOut();
}

let unsubscribeSnapshot = null;
let unsubscribePeople = null;

// Shown when the security rule refuses this Google account
function showNoAccess(user) {
  loadingEl.style.display = "none";
  app.style.display = "none";
  signinMsg.textContent = `${user.email} doesn't have access to this list.`;
  signinBtn.textContent = "Try a different account";
  signinBtn.onclick = () => { auth.signOut().then(doSignIn); };
  signinEl.style.display = "flex";
}

auth.onAuthStateChanged((user) => {
  if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  if (unsubscribePeople) { unsubscribePeople(); unsubscribePeople = null; }
  myUid = null; myKey = null; otherKey = null; peopleLoaded = false;

  if (!user) {
    loadingEl.style.display = "none";
    app.style.display = "none";
    signinMsg.textContent = "Sign in to see your list";
    signinBtn.textContent = "Sign in with Google";
    signinBtn.onclick = doSignIn;
    signinEl.style.display = "flex";
    return;
  }

  // Listen for who's who (this person's pick), live
  myUid = user.uid;
  unsubscribePeople = peopleRef.onSnapshot(
    (snap) => {
      const people = snap.exists ? snap.data() : {};
      const pick = people[myUid];
      myKey = pick === "colleen" || pick === "dave" ? pick : null;
      otherKey = myKey === "dave" ? "colleen" : myKey === "colleen" ? "dave" : null;
      peopleLoaded = true;
      if (state) render();
    },
    (err) => {
      if (err.code === "permission-denied") showNoAccess(user);
      else console.error(err);
    }
  );

  signinEl.style.display = "none";
  loadingEl.style.display = "flex";

  // Real-time listener — this is what makes it sync live between devices
  unsubscribeSnapshot = docRef.onSnapshot(
    (snap) => {
      if (suppressNextSnapshot) { suppressNextSnapshot = false; return; }
      if (snap.exists) {
        state = snap.data();
      } else {
        state = buildDefaultState();
        docRef.set(state).catch(() => {});
      }
      loadingEl.style.display = "none";
      app.style.display = "block";
      render();
    },
    (err) => {
      console.error(err);
      // The security rule said no: this Google account isn't on the list
      if (err.code === "permission-denied") { showNoAccess(user); return; }
      loadingEl.textContent = "Couldn't connect — check the Firebase config in this file.";
    }
  );
});

function save() {
  suppressNextSnapshot = true;
  docRef.set(state).catch((err) => {
    console.error(err);
    showStatus("Couldn't save — check your connection.", true);
  });
}

let statusTimeout;
function showStatus(msg, isError) {
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = msg;
  el.className = "status " + (isError ? "error" : "ok");
  clearTimeout(statusTimeout);
  statusTimeout = setTimeout(() => { el.textContent = ""; el.className = "status"; }, 2000);
}

function resizePhoto(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function toggleItem(storeName, id) {
  state.stores[storeName] = state.stores[storeName].map(i =>
    i.id === id ? { ...i, checked: !i.checked } : i
  );
  render(); save();
}

function removeItem(storeName, id) {
  state.stores[storeName] = state.stores[storeName].filter(i => i.id !== id);
  render(); save();
}

function addItem(storeName, text) {
  if (!text.trim()) return;
  state.stores[storeName].push({ id: makeId(text, Date.now()), text: text.trim(), checked: false, photo: null, who: "both" });
  render(); save();
}

const FIRESTORE_DOC_LIMIT = 1048576; // Firestore's per-document size cap

function attachPhoto(storeName, id, file) {
  if (!file) return;
  resizePhoto(file, (dataUrl) => {
    const proposed = { ...state, stores: { ...state.stores,
      [storeName]: state.stores[storeName].map(i => i.id === id ? { ...i, photo: dataUrl } : i)
    }};
    if (JSON.stringify(proposed).length > FIRESTORE_DOC_LIMIT * 0.9) {
      showStatus("Photo won't fit — list is getting full of photos. Remove one first.", true);
      return;
    }
    state = proposed;
    render(); save();
    showStatus("Photo saved", false);
  });
}

function removePhoto(storeName, id) {
  state.stores[storeName] = state.stores[storeName].map(i =>
    i.id === id ? { ...i, photo: null } : i
  );
  render(); save();
}

let lightboxTarget = null;

function openLightbox(storeName, id) {
  const item = state.stores[storeName].find(i => i.id === id);
  if (!item || !item.photo) return;
  lightboxTarget = { storeName, id };
  document.getElementById("lightbox-img").src = item.photo;
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  lightboxTarget = null;
}

function removePhotoFromLightbox() {
  if (!lightboxTarget) return;
  removePhoto(lightboxTarget.storeName, lightboxTarget.id);
  closeLightbox();
}

function uncheckAll(storeName) {
  state.stores[storeName] = state.stores[storeName].map(i => ({ ...i, checked: false }));
  render(); save();
}

function addStore(name) {
  name = name.trim();
  if (!name || state.stores[name]) return;
  state.stores[name] = [];
  render(); save();
}

function startOver() {
  if (!confirm("Reset the whole list back to the original items? This clears all checks and photos.")) return;
  state = buildDefaultState();
  render(); save();
}

let addingStore = false;

function render() {
  const stores = state.stores;
  // Counts only include what the current filter shows
  const allItems = Object.values(stores).flat().filter(isVisible);
  const totalDone = allItems.filter(i => i.checked).length;
  const otherName = otherKey === "colleen" ? "Colleen's" : "Dave's";
  const meName = myKey === "dave" ? "Dave" : "Colleen";

  let html = `
    <div class="top-row">
      <h1>Grocery Run</h1>
      <div style="display:flex; gap:14px; align-items:baseline;">
        <button class="start-over" onclick="doSignOut()">Sign out</button>
        <button class="start-over" onclick="startOver()">Start over</button>
      </div>
    </div>
    <p class="progress">${totalDone} of ${allItems.length} picked up</p>
    <p class="status" id="status"></p>
  `;

  if (!myKey) {
    // One-time question per person, so "Mine" knows who you are
    if (peopleLoaded) {
      html += `
        <div class="who-pick">
          <span>Who's on this phone?</span>
          <button onclick="setMe('colleen')">Colleen</button>
          <button onclick="setMe('dave')">Dave</button>
        </div>
      `;
    }
  } else {
    const f = filter; // "all" | "me" | "other"
    html += `
      <div class="filter-bar">
        <button class="${f === "all" ? "active" : ""}" onclick="setFilter('all')">Everything</button>
        <button class="${f === "me" ? "active" : ""}" onclick="setFilter('me')">Mine</button>
        <button class="${f === "other" ? "active" : ""}" onclick="setFilter('other')">${otherName}</button>
      </div>
      <p class="who-me">You're ${meName} · <button onclick="clearMe()">change</button></p>
    `;
  }

  for (const [name, storeItems] of Object.entries(stores)) {
    const items = storeItems.filter(isVisible); // only this view's items
    const done = items.filter(i => i.checked).length;
    html += `
      <div class="store-card">
        <div class="store-header">
          <div>
            <h2>${escapeHtml(name)}</h2>
            <p>${done} / ${items.length} in cart</p>
          </div>
          <button class="uncheck-btn" onclick="uncheckAll('${escapeAttr(name)}')" aria-label="Uncheck all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
        </div>
        <ul>
    `;
    items.forEach(item => {
      html += `
        <li class="item">
          <button class="checkbox ${item.checked ? "checked" : ""}" onclick="toggleItem('${escapeAttr(name)}','${escapeAttr(item.id)}')" aria-label="toggle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="item-text ${item.checked ? "checked" : ""}" onclick="toggleItem('${escapeAttr(name)}','${escapeAttr(item.id)}')">${escapeHtml(item.text)}</button>
          <button class="who-tag ${whoOf(item)}" onclick="cycleWho('${escapeAttr(name)}','${escapeAttr(item.id)}')" aria-label="Who shops for this">${WHO_LABEL[whoOf(item)]}</button>
          ${item.photo
            ? `<div class="thumb-wrap">
                 <img class="thumb" src="${escapeHtml(item.photo)}" onclick="openLightbox('${escapeAttr(name)}','${escapeAttr(item.id)}')" />
                 <button class="thumb-remove" onclick="removePhoto('${escapeAttr(name)}','${escapeAttr(item.id)}')" aria-label="Remove photo">
                   <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                 </button>
               </div>`
            : `<button class="icon-btn" onclick="document.getElementById('file-${escapeAttr(item.id)}').click()" aria-label="Attach photo">
                 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
               </button>`
          }
          <input type="file" accept="image/*" id="file-${escapeAttr(item.id)}" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;" onchange="attachPhoto('${escapeAttr(name)}','${escapeAttr(item.id)}', this.files[0])" />
          <button class="icon-btn remove" onclick="removeItem('${escapeAttr(name)}','${escapeAttr(item.id)}')" aria-label="Remove">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </li>
      `;
    });
    if (items.length === 0 && storeItems.length > 0) {
      html += `<li class="empty-note">Nothing here for this view</li>`;
    }
    html += `
        </ul>
        <form class="add-row" onsubmit="event.preventDefault(); addItem('${escapeAttr(name)}', this.itemInput.value); this.reset();">
          <input type="text" name="itemInput" placeholder="Add item to ${escapeHtml(name)}..." />
          <button type="submit" class="add-btn" aria-label="Add">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </form>
      </div>
    `;
  }

  if (addingStore) {
    html += `
      <form class="add-store-row" onsubmit="event.preventDefault(); addStore(this.storeInput.value); addingStore=false; render();">
        <input type="text" name="storeInput" id="new-store-input" placeholder="Store name..." autofocus />
        <button type="submit" class="save">Add</button>
        <button type="button" class="cancel" onclick="addingStore=false; render();">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </form>
    `;
  } else {
    html += `
      <button class="add-store-btn" onclick="addingStore=true; render(); document.getElementById('new-store-input').focus();">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add another store
      </button>
    `;
  }

  app.innerHTML = html;
}

// Make text safe to show inside HTML (including inside "quoted" attributes)
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
// Make text safe inside onclick="fn('...')": first escape \ and ' for the
// JavaScript string, then HTML-escape so " can't end the attribute early.
function escapeAttr(str) {
  return escapeHtml(String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
}
</script>
